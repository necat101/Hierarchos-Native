[package]
name = "hierarchos-vulkan"
version = "0.1.0"
edition = "2021"
description = "Vulkan compute training backend for Hierarchos coherent-v9 and Hugging Face decoder Transformers"
license = "MIT"

[dependencies]
anyhow = "1"
ash = "0.38"
bytemuck = { version = "1", features = ["derive"] }
hierarchos-inference = { path = "../hierarchos-inference" }
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
# Training checkpoint export edits a few non-contract JSON fields in-place.
# RawValue lets that narrow edit preserve every pre-existing top-level value
# verbatim without changing serde_json's normal typed-number deserialization.
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
# Production Rust PEFT schema/key interoperability only. Transformer LoRA
# forward/backward/AdamW math remains implemented by our Vulkan graph.
peft-rs = "=1.2.0"
regex = "1"
# Host-side one-time PEFT decomposition initializers (PiSSA and related
# adapter setup). Transformer forward/backward math remains Vulkan-native.
nalgebra = "0.33"
# Rust-native Hugging Face acquisition/tokenization for the Transformer trainer.
# Model math never flows through these crates; they are host-side I/O only.
hf-hub = { version = "=1.0.0", features = ["blocking", "rustls-tls"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "hierarchos-vulkan-head-step"
path = "src/bin/head_step.rs"

