name: native oracle provenance probe

on:
  push:
    branches: [codex/rdna3-phase19-instrumented]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2022
    env:
      ATEN_CPU_CAPABILITY: avx2
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the recorded CPU framework
        run: |
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.3 pillow==13.0.0
      - name: Reproduce the unmodified vision generator
        run: python hierarchos-vulkan/validation/freeze_deepseek_v41_vision.py --output "$env:RUNNER_TEMP/native-vision-reproduced.json"
      - name: Compare every original byte
        shell: python
        run: |
          import hashlib, json, os, pathlib, platform
          import numpy, torch
          original = pathlib.Path('hierarchos-vulkan/validation/fixtures/deepseek_v41_native_vision_avx2.json')
          reproduced = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-vision-reproduced.json'
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          report = dict(torch=torch.__version__, numpy=numpy.__version__, cpu=torch.backends.cpu.get_cpu_capability(),
                        processor=platform.processor(), torch_revision=torch.version.git_version,
                        generator_sha256=sha(pathlib.Path('hierarchos-vulkan/validation/freeze_deepseek_v41_vision.py')),
                        original_sha256=sha(original), generated_sha256=sha(reproduced),
                        byte_identical=original.read_bytes() == reproduced.read_bytes())
          print('NATIVE_ORACLE_PROBE_BEGIN')
          print(json.dumps(report, sort_keys=True))
          print('NATIVE_ORACLE_PROBE_END')
          (reproduced.parent / 'native-oracle-probe.json').write_text(json.dumps(report, indent=2))
          assert report['byte_identical'], 'Original fixture was not reproduced; no provenance pin may be issued'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-oracle-probe
          path: |
            ${{ runner.temp }}/native-vision-reproduced.json
            ${{ runner.temp }}/native-oracle-probe.json
          retention-days: 14
