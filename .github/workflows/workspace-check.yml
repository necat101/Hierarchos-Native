name: workspace check

on:
  push:
  pull_request:

jobs:
  workspace-check:
    # The four crates are Windows-first and check-workspace.ps1 builds its
    # workspace from directory junctions, so the gate runs on a Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The historical GPT-2 guard resolves bound bytes against committed
          # blobs; a depth-1 checkout has none, so it fails closed.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-workspace-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-workspace-

      # Windows-only runtime check for the RDNA3 workflow's cygpath wiring.
      # It creates no Cargo target and does not require a physical GPU.
      - name: RDNA3 Windows path smoke test
        shell: bash
        run: python -m unittest discover -s hierarchos-vulkan/validation -p "test_rdna3_workflow_paths.py"

      - name: One-pass workspace check
        shell: pwsh
        run: ./check-workspace.ps1

      # Binds the tracked RDNA3 multimodal receipts by SHA-256, re-derives the
      # 44/44 and 85/85 totals from the per-profile rows. CPU-side; no adapter needed.
      - name: RDNA3 multimodal receipt guard
        run: python hierarchos-vulkan/validation/check_rdna3_multimodal_receipts.py

      - name: Expanded RDNA3 GPT2 receipt guard (historical integrity)
        run: python hierarchos-vulkan/validation/check_rdna3_gpt2_receipts.py --historical-only

      # A historical receipt binds its own revision, so it can never qualify a
      # different checkout. Current source needs a receipt bound to this HEAD:
      # the Phase XV families check re-verifies the historical bindings, and the
      # Phase XVI checker re-derives the two-pass gradient and dispatch evidence
      # from the logs the receipt ships and re-verifies the 45-artifact gate.
      # Both are required; a stale receipt fails closed rather than reaching for
      # the sealed Phase XV one.
      - name: Phase XIX-X current-source instrumented qualification
        run: python hierarchos-vulkan/validation/check_phase19x_current.py

      - name: Phase XIX-X current-source negative controls
        run: python -m unittest discover -s hierarchos-vulkan/validation -p "test_phase19x_current.py"

      - name: Phase XIX-T policy overlay
        run: python hierarchos-vulkan/validation/check_phase19t_current.py

      - name: Phase XIX-T isolated negative controls
        run: python -m unittest discover -s hierarchos-vulkan/validation -p "test_phase19t_current.py"

      - name: Phase XIX-U historical audit
        run: python hierarchos-vulkan/validation/check_phase19u_audit.py

      - name: Phase XIX-U audit negative controls
        run: python -m unittest discover -s hierarchos-vulkan/validation -p "test_phase19u_audit.py"

      - name: Expanded RDNA3 GPT2 receipt negative controls
        run: python -m unittest discover -s hierarchos-vulkan/validation -p "test_rdna3_gpt2_receipts.py"

      # Every rejection the Phase XVI contract depends on, exercised against a
      # receipt that genuinely passes before the mutation is applied.
      - name: Phase XVI qualification negative controls
        run: python -m unittest discover -s hierarchos-vulkan/validation -p "test_phase16_receipts.py"



      # The measured route tables are checked in, so the cheapest guard against a
      # stale one is a CPU-side comparison of each receipt with the record it was
      # written into. The checker covers every producer with a route record -- the
      # time-mix projection, the channel mix, the dense and FP16-storage low-rank
      # routes, the key/state fusion, and the two packed TBPTT chains -- plus the
      # TBPTT and packed-composition receipts that consume those records. It fails
      # when a receipt stops covering a recorded batch, when a recorded route is no
      # longer the fastest candidate in the receipt it was measured with, or when
      # the default stops building it. The GPU job re-records each receipt and runs
      # the same command.
      #
      # The A/B workflow's steps, test matrix and artifact paths are rendered from
      # that same spec table, so --check fails when a producer was added to the
      # guard but not to its sweep, guard step, tests or uploaded receipts.
      - name: A/B workflow matches the route guard's spec table
        run: python hierarchos-vulkan/validation/render_ab_workflow.py --check

      # Audits use the recorded library pair without importing torch. The
      # hash-bound legacy set may only shrink after a successful reproduction;
      # --strict additionally rejects that historical, unverified set.
      - name: V4.1 fixture provenance
        run: |
          python hierarchos-vulkan/validation/fixture_toolchain.py check-all --expect-from hierarchos-vulkan/validation/fixtures/deepseek_v41_mixed_block128.json
          python -m unittest discover -s hierarchos-vulkan/validation -p "test_fixture_toolchain.py"

      - name: Recorded measurement routes
        run: |
          python hierarchos-vulkan/validation/check_measured_producer_routes.py

      - name: Gen9 strict qualification negative controls
        run: python -m unittest discover -s hierarchos-vulkan/validation -p "test_gen9_architectures.py"

      - name: RDNA3 regression collection negative controls
        run: python -m unittest discover -s hierarchos-vulkan/validation -p "test_rdna3_final_regression.py"

      - name: Multimodal training qualification negative controls
        run: python -m unittest discover -s hierarchos-vulkan/validation -p "test_multimodal_training.py"

      - name: Image pipeline qualification negative controls
        run: python -m unittest discover -s hierarchos-vulkan/validation -p "test_llava_pipeline.py"

      - name: Gemma3 image qualification controls
        run: python -m unittest discover -s hierarchos-vulkan/validation -p "test_gemma3_pipeline.py"

      - name: Gemma4 image qualification controls
        run: python -m unittest discover -s hierarchos-vulkan/validation -p "test_gemma4_pipeline.py"

      # The committed ladder receipt is the only durable record of a green
      # `verify_training_stack.py` run. This check is CPU-side: it holds the
      # receipt to the ladder's twelve steps in order, every one PASS, and the
      # coverage floors (golden invocations, matched shader variants, comparison
      # modules, training-state runs and exact tensor digests) that the ladder
      # verifies. A run that drops a step or exercises fewer cases fails here
      # even though every remaining step passed. The GPU ladder run compares its
      # fresh receipt with `--compare` before re-recording it.
      - name: Committed training-stack receipt
        run: python hierarchos-vulkan/validation/check_training_stack_receipt.py

      # The folded-publication profiles are the measurement behind the audit's
      # "the counters and the batch-order reduction are both below the noise"
      # conclusion. This check is CPU-side: it re-derives every delta, ratio and
      # resolution from the timed legs, requires the gates the legs cleared, and
      # fails when the fold starts leading or either component becomes visible --
      # which is a real result, but one that has to change the conclusion and this
      # guard in the same diff rather than quietly contradict the document.
      - name: Committed folded-publication profile
        run: |
          python hierarchos-vulkan/validation/check_folded_publication_profile.py
          python -m unittest discover -s hierarchos-vulkan/validation -p "test_folded_publication_profile.py"

  workflow-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate GitHub Actions workflows
        shell: bash
        run: actionlint -color
