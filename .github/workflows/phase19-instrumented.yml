name: phase19 instrumented qualification

on:
  push:
    branches: [codex/rdna3-phase19-instrumented]
  pull_request:
    branches: [codex/rdna3-phase19-instrumented]

jobs:
  activation:
    runs-on: ubuntu-latest
    env:
      HIERARCHOS_ACTIVATION_RECEIPT: hierarchos-vulkan/validation/release_parity/multimodal_training/20261110-phase19s-current-source/activation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Phase XIX-S activation receipt
        run: python hierarchos-vulkan/validation/check_activation_phase19r.py
      - name: Phase XIX-S activation negative controls
        run: python -m unittest discover -s hierarchos-vulkan/validation -p "test_activation_phase19s_current.py"

  historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify retained Phase XIX-U historical audit
        run: python hierarchos-vulkan/validation/check_phase19u_audit.py
      - name: Phase XIX-V historical runner negative controls
        run: python -m unittest discover -s hierarchos-vulkan/validation -p "test_phase19u_ci_runner.py" -v
      - name: Reproduce all five historical suites
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/phase19u-ci"
          python hierarchos-vulkan/validation/run_phase19u_historical_ci.py --output-dir "$output"
      - name: Validate structured historical CI report
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/phase19u-ci"
          python hierarchos-vulkan/validation/run_phase19u_historical_ci.py --check-report "$output/phase19u-historical-ci-results.json"
      - name: Upload historical CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase19u-historical-ci
          path: ${{ runner.temp }}/phase19u-ci
          retention-days: 14
      - name: Prune historical worktrees
        if: always()
        run: git worktree prune
