[package]
name = "hierarchos-gui"
version = "0.1.0"
edition = "2021"
description = "Native desktop launcher for Hierarchos and Vulkan Transformer training"
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "pnm"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "hierarchos-native"
path = "src/main.rs"
